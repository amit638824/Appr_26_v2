<style>

.top-left,.top-actions,.brand,.searchbox,.user-menu{display:flex;align-items:center}.top-left{gap:18px}.brand{gap:11px;text-decoration:none;color:var(--ink);font-size:18px;font-weight:750;letter-spacing:-.5px}.brand-logo{height:36px;width:36px;border-radius:11px;background:linear-gradient(145deg,#6c94ff,#3f6fe7);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 5px 12px #4f7df333}.searchbox{height:38px;width:min(310px,30vw);gap:9px;padding:0 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;color:var(--muted)}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:13px}.searchbox kbd{font-size:10px;border:1px solid #e1e6ef;border-radius:4px;padding:1px 5px;color:#9aa4b3;white-space:nowrap}.top-actions{gap:18px}.icon-button{height:37px;width:37px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#68758a;display:grid;place-items:center;position:relative}.icon-button:hover{background:#f7f9ff;color:var(--blue)}.notification-dot{position:absolute;right:7px;top:7px;height:6px;width:6px;background:#f16b78;border:1px solid white;border-radius:50%}.user-menu{gap:10px;padding-left:16px;border-left:1px solid var(--line);position:relative}.avatar{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;background:#e8efff;color:#3d66c7;font-weight:750}.user-copy{line-height:1.25}.user-copy strong{display:block;font-size:12px}.user-copy span{font-size:11px;color:var(--muted)}.dropdown{display:none;position:absolute;right:0;top:48px;width:165px;padding:7px;background:white;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.dropdown.open{display:block}.dropdown button{width:100%;text-align:left;padding:9px;border:0;border-radius:7px;background:white;color:#536176;font-size:12px}.dropdown button:hover{background:#f4f7ff;color:var(--blue)}
.menu-toggle{display:none;border:1px solid var(--line);background:white;border-radius:8px;height:36px;width:38px;color:var(--ink);font-size:18px}
.sidebar{position:fixed;z-index:25;top:var(--top);bottom:0;left:0;width:var(--sidebar);padding:25px 15px 18px;background:#fff;border-right:1px solid var(--line);transition:width .2s,transform .2s;overflow-y:auto}.side-label{padding:0 12px;margin:0 0 11px;color:#a0aabb;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.nav-button{width:100%;height:44px;display:flex;align-items:center;gap:13px;padding:0 13px;margin:4px 0;border:0;border-radius:9px;background:transparent;color:#66748a;text-align:left;font-size:13px;font-weight:560;transition:background .16s,color .16s;position:relative}.nav-button:hover{background:#f6f8fd;color:var(--blue)}.nav-button.active{background:var(--blue-soft);color:var(--blue);font-weight:700}.nav-button.active:before{content:"";position:absolute;left:-15px;top:9px;bottom:9px;width:3px;border-radius:0 4px 4px 0;background:var(--blue)}.nav-icon{width:20px;display:inline-grid;place-items:center;font-size:17px}.sidebar-bottom{position:absolute;bottom:18px;left:15px;right:15px;padding:14px;border-radius:10px;background:#f7f9fe;color:#68758a;font-size:11px}.sidebar-bottom strong{display:block;color:#35445d;font-size:12px;margin-bottom:3px}
.main-content{margin-left:var(--sidebar);padding:calc(var(--top) + 30px) 32px 36px;min-height:100vh;transition:margin-left .2s}.content-panel{max-width:1500px;margin:auto}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:23px}.eyebrow{margin:0 0 6px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.25px;text-transform:uppercase}h1{margin:0;font-size:26px;line-height:1.2;letter-spacing:-.8px}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.date-pill{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#69768a;font-size:11px;white-space:nowrap}
.grid{display:grid;gap:17px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:var(--shadow);min-width:0}.card-title{margin:0 0 5px;font-size:14px;font-weight:700}.card-desc{margin:0;color:var(--muted);font-size:12px}.stat-card{padding:18px 19px}.stat-top{display:flex;align-items:center;justify-content:space-between}.stat-icon{height:36px;width:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:17px}.stat-name{color:#8490a2;font-size:11px;font-weight:600}.stat-value{font-size:26px;font-weight:760;letter-spacing:-.8px;margin:12px 0 4px}.trend{font-size:10px;color:#1b9a70;font-weight:700}.trend.down{color:#e06b78}.muted{color:var(--muted)}.section-space{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-head h2{margin:0;font-size:14px}.small-link{border:0;background:none;color:var(--blue);font-size:11px;font-weight:700}
.hero{padding:25px 27px;border:1px solid #e1eaff;border-radius:14px;background:linear-gradient(110deg,#f0f5ff,#fff 75%);display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.hero h2{margin:0;font-size:20px;letter-spacing:-.5px}.hero p{margin:7px 0 0;color:#73819a;font-size:12px}.hero-mark{height:66px;width:66px;border-radius:18px;background:#e0eaff;color:#4777e9;display:grid;place-items:center;font-size:30px}
.activity-list{list-style:none;margin:0;padding:0}.activity-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f0f2f7;font-size:12px}.activity-list li:last-child{border:0}.activity-left{display:flex;align-items:center;gap:10px}.activity-bullet{width:8px;height:8px;border-radius:50%;background:#6c91f1}.time{color:#a0a9b7;font-size:10px;white-space:nowrap}
.chart{height:190px;display:flex;align-items:flex-end;gap:12px;padding:17px 6px 0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 45px,#f0f3f8 46px)}.bar-group{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar{width:min(24px,75%);border-radius:5px 5px 0 0;background:linear-gradient(180deg,#83a5ff,#4f7df3)}.bar-label{font-size:10px;color:#9aa4b3}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:450px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eff2f7;font-size:11px}th{color:#9aa4b3;font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:9px}td{color:#536176}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#eaf8f2;color:#26966e;font-size:9px;font-weight:700}
.profile-head{display:flex;align-items:center;gap:15px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.profile-avatar{height:62px;width:62px;border-radius:18px;display:grid;place-items:center;background:#e8efff;color:#4772d9;font-size:22px;font-weight:800}.profile-head h2{margin:0 0 4px;font-size:16px}.profile-head p{margin:0;color:var(--muted);font-size:12px}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field-label{display:block;margin-bottom:5px;color:#9aa4b3;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.field-value{font-size:12px;color:#354258}
.service-icon{height:40px;width:40px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);border-radius:11px;font-size:18px;margin-bottom:15px}.service-card{transition:transform .18s,border-color .18s}.service-card:hover{transform:translateY(-3px);border-color:#d5e1ff}.service-card h2{margin:0 0 7px;font-size:14px}.service-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}.primary-btn,.secondary-btn{padding:9px 14px;border-radius:8px;font-size:11px;font-weight:700;border:1px solid transparent}.primary-btn{background:var(--blue);color:#fff}.primary-btn:hover{background:var(--blue-dark)}.secondary-btn{background:#fff;color:#52627a;border-color:var(--line)}.secondary-btn:hover{background:#f7f9ff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-field{display:flex;flex-direction:column;gap:6px}.form-field.full{grid-column:1/-1}.form-field label{font-size:11px;color:#65738a;font-weight:700}.form-field input,.form-field textarea{width:100%;padding:11px 12px;border:1px solid #e2e8f1;border-radius:8px;outline:0;background:#fbfcfe;color:var(--ink);font-size:12px}.form-field input:focus,.form-field textarea:focus{border-color:#91adf8;box-shadow:0 0 0 3px #edf3ff}.form-field textarea{min-height:105px;resize:vertical}.success-message{display:none;margin-top:12px;padding:10px 12px;background:#eaf8f2;color:#23845f;border-radius:8px;font-size:11px}
.collapsed .sidebar{width:76px}.collapsed .main-content{margin-left:76px}.collapsed .side-label,.collapsed .nav-text,.collapsed .sidebar-bottom{display:none}.collapsed .sidebar{padding-left:12px;padding-right:12px}.collapsed .nav-button{justify-content:center;padding:0}.collapsed .nav-button.active:before{left:-12px}
.overlay{display:none}
@media(max-width:1100px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}.main-content{padding-left:22px;padding-right:22px}.searchbox{width:230px}}
@media(max-width:760px){:root{--top:64px}.topbar{padding:0 14px}.menu-toggle{display:block}.brand{font-size:16px}.searchbox{display:none}.top-actions{gap:9px}.user-copy{display:none}.user-menu{padding-left:9px}.sidebar{transform:translateX(-100%);width:252px;box-shadow:none}.sidebar.open{transform:translateX(0);box-shadow:10px 0 30px #1b2b4a22}.collapsed .sidebar{width:252px}.collapsed .side-label,.collapsed .nav-text,.collapsed .sidebar-bottom{display:block}.collapsed .nav-button{justify-content:flex-start;padding:0 13px}.collapsed .main-content{margin-left:0}.main-content{margin-left:0;padding:calc(var(--top) + 22px) 14px 25px}.four,.three,.two{grid-template-columns:repeat(2,minmax(0,1fr))}.page-heading{align-items:flex-start;flex-direction:column}.sidebar-bottom{position:static;margin-top:25px}.overlay.show{display:block;position:fixed;inset:var(--top) 0 0;background:#17243b44;z-index:22}}
@media(max-width:480px){.four,.three,.two,.field-grid,.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.hero{padding:19px}.hero-mark{height:50px;width:50px}.stat-value{font-size:23px}.card{padding:17px}.date-pill{display:none}}

:root{--blue:#6558e8;--blue-dark:#5144d2;--blue-soft:#f0efff;--ink:#18213b;--muted:#7d849b;--line:#e9eaf3;--canvas:#f5f6fc;--shadow:0 12px 34px rgba(37,42,92,.075)}

.main-content{padding:calc(var(--top) + 34px) 36px 42px}

<body>
<header class="topbar">
  <div class="top-left">
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">☰</button>

<script>
const pages={
home:`
<div class="hero"><div><p class="eyebrow">Your workspace</p><h2>Good morning, Jamie 👋</h2><p>Here’s what’s happening with your workspace today.</p></div><div class="hero-mark">✦</div></div>
<div class="grid four">
<article class="card stat-card"><div class="stat-top"><span class="stat-name">Total visitors</span><span class="stat-icon">◉</span></div><div class="stat-value">12,840</div><span class="trend">↑ 12.8% <span class="muted">vs last month</span></span></article>
<article class="card stat-card"><div class="stat-top"><span class="stat-name">Active projects</span><span class="stat-icon">▦</span></div><div class="stat-value">24</div><span class="trend">↑ 4.2% <span class="muted">vs last month</span></span></article>
<article class="card stat-card"><div class="stat-top"><span class="stat-name">New messages</span><span class="stat-icon">✉</span></div><div class="stat-value">18</div><span class="trend">↑ 8.1% <span class="muted">vs last month</span></span></article>
<article class="card stat-card"><div class="stat-top"><span class="stat-name">Tasks completed</span><span class="stat-icon">✓</span></div><div class="stat-value">86%</div><span class="trend">↑ 2.4% <span class="muted">vs last month</span></span></article>
</div>
<div class="grid two section-space"><article class="card"><div class="section-head"><div><h2>Recent activity</h2><p class="card-desc">Latest updates from your workspace</p></div><button class="small-link" data-go="dashboard">View all</button></div><ul class="activity-list"><li><span class="activity-left"><i class="activity-bullet"></i>Profile information updated</span><span class="time">10 min ago</span></li><li><span class="activity-left"><i class="activity-bullet"></i>New service request received</span><span class="time">1 hour ago</span></li><li><span class="activity-left"><i class="activity-bullet"></i>Monthly report generated</span><span class="time">Yesterday</span></li><li><span class="activity-left"><i class="activity-bullet"></i>New team member added</span><span class="time">2 days ago</span></li></ul></article>
<article class="card"><div class="section-head"><div><h2>Quick overview</h2><p class="card-desc">Your weekly progress</p></div><span class="date-pill">This week</span></div><div class="chart">${[42,66,52,82,61,93,73].map((v,i)=>`<div class="bar-group"><div class="bar" style="height:${v}%"></div><span class="bar-label">${["M","T","W","T","F","S","S"][i]}</span></div>`).join("")}</div></article></div>`,
dashboard:`
<div class="page-heading"><div><p class="eyebrow">Analytics</p><h1>Dashboard</h1><p class="subtitle">Monitor your key workspace metrics and recent performance.</p></div><span class="date-pill">◷ &nbsp; Last 7 days</span></div>
<div class="grid four">
<article class="card stat-card"><div class="stat-top"><span class="stat-name">Total revenue</span><span class="stat-icon">$</span></div><div class="stat-value">$24,680</div><span class="trend">↑ 10.4% <span class="muted">from last week</span></span></article>
<article class="card stat-card"><div class="stat-top"><span class="stat-name">New users</span><span class="stat-icon">♙</span></div><div class="stat-value">1,284</div><span class="trend">↑ 8.2% <span class="muted">from last week</span></span></article>
<article class="card stat-card"><div class="stat-top"><span class="stat-name">Conversion rate</span><span class="stat-icon">↗</span></div><div class="stat-value">6.84%</div><span class="trend down">↓ 1.2% <span class="muted">from last week</span></span></article>

const panel=document.getElementById('mainPanel'),sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay'),menuToggle=document.getElementById('menuToggle'),profileDropdown=document.getElementById('profileDropdown');
const buttons=[...document.querySelectorAll('.nav-button')];
function showPage(name){
  panel.classList.add('changing');
  panel.innerHTML=pages[name]||pages.home;
  buttons.forEach(b=>{const active=b.dataset.page===name;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  closeMobileSidebar();
  panel.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.go)));
  panel.querySelectorAll('[data-service]').forEach(b=>b.addEventListener('click',()=>alert(b.dataset.service+' details can be connected here.')));
  const form=document.getElementById('contactForm');
  if(form)form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;document.getElementById('successMessage').style.display='block';form.reset()});
  const edit=document.getElementById('editProfile');if(edit)edit.addEventListener('click',()=>alert('Connect this action to your profile edit form.'));
  requestAnimationFrame(()=>panel.classList.remove('changing'));
}
buttons.forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
function closeMobileSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');menuToggle.setAttribute('aria-expanded','false')}
menuToggle.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');overlay.classList.toggle('show',open);menuToggle.setAttribute('aria-expanded',String(open))});
overlay.addEventListener('click',closeMobileSidebar);
document.getElementById('collapseToggle').addEventListener('click',()=>document.body.classList.toggle('collapsed'));
document.getElementById('profileMenuButton').addEventListener('click',e=>{e.stopPropagation();const open=profileDropdown.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(open))});
document.addEventListener('click',()=>{profileDropdown.classList.remove('open');document.getElementById('profileMenuButton').setAttribute('aria-expanded','false')});
profileDropdown.addEventListener('click',e=>{e.stopPropagation();const action=e.target.dataset.profileAction;if(action==='profile')showPage('profile');else if(action)alert(action==='logout'?'Demo sign-out action.':'Account settings can be added here.');profileDropdown.classList.remove('open')});
document.getElementById('notificationButton').addEventListener('click',()=>alert('You are all caught up!'));
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const term=e.target.value.toLowerCase().trim();const match=buttons.find(b=>b.textContent.toLowerCase().includes(term));if(match){showPage(match.dataset.page);e.target.value=''}else alert('No matching section found.')}})
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}if(e.key==='Escape')closeMobileSidebar()});
showPage('home');
</script>
</body>
</html>
