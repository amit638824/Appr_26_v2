<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="row">
        <div class="col-sm-4"></div>
        <div class="col-sm-4 mt-3">
            <h1 class="text-center">#Form<span class="text-danger">Validation</span></h1>
            <input type="text" id="name" class="form-control " placeholder="Enter Your Name">
            <p class="text-danger mb-3" id="nameErr"></p>
            <input type="email" id="email" class="form-control " placeholder="Enter Your Email">
            <p class="text-danger mb-3" id="emailErr"></p>
            <input type="text" id="phone" class="form-control " placeholder="Enter Your Phone">
            <p class="text-danger mb-3" id="phoneErr"></p>
            <input type="submit" onclick="add()" value="submit" class="btn btn-warning w-100 text-light">
        </div>
        <div class="col-sm-4"></div>
    </div>
    <script>
        const validate = () => {
            let name = document.querySelector('#name')
            let email = document.querySelector('#email')
            let phone = document.querySelector('#phone')
            let nameErr = document.querySelector('#nameErr')
            let emailErr = document.querySelector('#emailErr')
            let phoneErr = document.querySelector('#phoneErr')
            nameErr.innerHTML = ''
            emailErr.innerHTML = ''
            phoneErr.innerHTML = ''
            let allow = true;
            let nameReg = /^[a-zA-Z ]{2,18}$/;
            if (nameReg.test(name.value) == false) {
                nameErr.innerHTML = "Please Enter Valid Name"
                allow = false
            }
            let emailReg = /^[a-zA-Z0-9]+@[a-zA-Z0-9]+\.[a-zA-Z]{2,}$/;
            if (emailReg.test(email.value) == false) {
                emailErr.innerHTML = "Please Enter Valid Email"
                allow = false
            }
            let phoneReg = /^[6-9][0-9]{9}$/;
            if (phoneReg.test(phone.value) == false) {
                phoneErr.innerHTML = "Please Enter Valid phone"
                allow = false
            }

            return allow
        }

        const add = () => {
            const res = validate()
            if (res == true) {
                let name = document.querySelector('#name')
                let email = document.querySelector('#email')
                let phone = document.querySelector('#phone')
                alert(${ name.value } ${ email.value } ${ phone.value })
            }
        }
    </script>
    <script src="js/bootstrap.js"></script>
</body>

</html>
